command: ['streamlit', 'run', 'app.py', '--server.address=0.0.0.0', '--server.port', '$DATABRICKS_APP_PORT']
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: 'false'
  - name: RESEARCHMATCH_CATALOG
    value: workspace
  - name: RESEARCHMATCH_ENDPOINT
    value: vs_endpoint_1
